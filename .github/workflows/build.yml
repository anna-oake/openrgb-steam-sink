name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: 5.15.0
          arch: win64_msvc2019_64
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Fetch OpenRGB 1.0rc3
        shell: pwsh
        run: git clone --depth 1 --branch release_candidate_1.0rc3 https://gitlab.com/CalcProgrammer1/OpenRGB.git OpenRGB

      - name: Build plugin
        shell: cmd
        env:
          OPENRGB_SOURCE_DIR: ${{ github.workspace }}\OpenRGB
        run: scripts\build-windows.bat

      - uses: actions/upload-artifact@v4
        with:
          name: openrgb-steam-sink-windows
          path: build/OpenRGBSteamSinkPlugin.dll
